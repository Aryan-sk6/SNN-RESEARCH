[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snn-oddball"
version = "0.1.0"
description = "Stimulus adaptation vs prediction-error mechanisms in a small spiking network (replication and comparison)."
requires-python = ">=3.11"
dependencies = ["brian2==2.10.1", "numpy==2.5.4", "scipy==1.18.1", "matplotlib==3.11.2"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: runs spiking simulations (tens of seconds)"]
